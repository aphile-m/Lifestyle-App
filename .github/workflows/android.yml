name: Android APK

# Builds the Trainer App Android shell (Capacitor, loads the live GitHub Pages
# app so it's always current — no OTA pipeline needed) and publishes it as a
# GitHub release. Trigger manually from Actions -> Run workflow, or have Claude
# trigger it.

on:
  workflow_dispatch:
    inputs:
      notes:
        description: "Release notes"
        required: false
        default: "Android shell build."

permissions:
  contents: write

concurrency:
  group: android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@v3
      - name: Install deps and generate the Android project
        run: |
          npm install --no-audit --no-fund
          npx cap add android
          # Icon background is white so Vic (dark kit, dark hair) stays legible
          # on a dark home screen — on #0A0D08 the launcher icon vanished.
          # Splash stays dark to match the app itself.
          npx @capacitor/assets generate --android --assetPath assets --iconBackgroundColor '#FFFFFF' --iconBackgroundColorDark '#FFFFFF' --splashBackgroundColor '#0A0D08' --splashBackgroundColorDark '#0A0D08'
          npx cap sync android
      - name: Drop the adaptive-icon inset
        run: |
          set -euo pipefail
          # @capacitor/assets wraps both adaptive layers in <inset 16.7%>, which
          # maps each PNG onto the central 66.6% of the 108dp layer — exactly the
          # window the launcher shows. Net effect: the artwork renders small
          # inside a big white disc, and the corners outside the window are
          # transparent, so launcher parallax can reveal a gap. Point the layers
          # at the drawables directly and let the 66.6% window do the cropping.
          D=android/app/src/main/res/mipmap-anydpi-v26
          for f in ic_launcher ic_launcher_round; do
          cat > "$D/$f.xml" <<'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@mipmap/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          XML
          done
          grep -c inset "$D"/ic_launcher.xml && { echo "::error::inset still present"; exit 1; } || true
          cat "$D/ic_launcher.xml"
      - name: Stable signing + version stamp
        run: |
          set -euo pipefail
          # Copying the keystore into ~/.android is NOT enough: the Android
          # Gradle Plugin resolves the implicit debug keystore via ANDROID_SDK_HOME
          # (set by setup-android on the runner) and silently generates a fresh
          # one when it isn't there — which gave every release a different
          # signature, so updates failed with "package conflicts with an
          # existing package". Declare the signing config explicitly instead.
          # `android { }` is just a closure on the extension, so appending a
          # second block configures the same object.
          mkdir -p "$HOME/.android"
          cp android-signing/debug.keystore "$HOME/.android/debug.keystore"
          KS="$PWD/android-signing/debug.keystore"
          {
            echo ""
            echo "android {"
            echo "    signingConfigs {"
            echo "        stable {"
            echo "            storeFile file('$KS')"
            echo "            storePassword 'android'"
            echo "            keyAlias 'androiddebugkey'"
            echo "            keyPassword 'android'"
            echo "        }"
            echo "    }"
            echo "    buildTypes {"
            echo "        debug { signingConfig signingConfigs.stable }"
            echo "        release { signingConfig signingConfigs.stable }"
            echo "    }"
            echo "}"
          } >> android/app/build.gradle
          tail -20 android/app/build.gradle
          sed -i -E "s/versionCode [0-9]+/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i -E "s/versionName \"[^\"]*\"/versionName \"${{ github.run_number }}\"/" android/app/build.gradle
          # Health Connect (capacitor-health plugin) needs minSdk 26
          sed -i -E "s/minSdkVersion = [0-9]+/minSdkVersion = 26/" android/variables.gradle
          grep minSdkVersion android/variables.gradle
      - name: Verify the signing key is the stable one
        run: |
          set -euo pipefail
          EXPECTED=$(keytool -list -v -keystore android-signing/debug.keystore -storepass android \
            | grep -m1 'SHA256:' | tr -d ' ' | cut -d: -f2-)
          echo "expected cert: $EXPECTED"
          echo "EXPECTED_SHA=$EXPECTED" >> "$GITHUB_ENV"
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - name: Fail the build if the APK isn't signed with the stable key
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          ACTUAL=$("$BT/apksigner" verify --print-certs "$APK" \
            | grep -m1 -i 'SHA-256 digest' | awk '{print toupper($NF)}')
          EXPECT=$(echo "$EXPECTED_SHA" | tr -d ':' | tr 'a-f' 'A-F')
          echo "apk cert: $ACTUAL"
          echo "expected: $EXPECT"
          [ "$ACTUAL" = "$EXPECT" ] || {
            echo "::error::APK signed with the WRONG key — updates would fail to install over the previous release."
            exit 1
          }
          echo "✅ signed with the stable key — this build installs over the previous one"
      - name: Publish release
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          TAG="android-v${{ github.run_number }}"
          cp android/app/build/outputs/apk/debug/app-debug.apk Trainer-App.apk
          gh release create "$TAG" --title "Trainer App $TAG" --notes "$NOTES" --latest Trainer-App.apk
          echo "APK: https://github.com/${{ github.repository }}/releases/latest/download/Trainer-App.apk" >> "$GITHUB_STEP_SUMMARY"
