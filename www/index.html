<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0A0D08">
  <meta name="color-scheme" content="dark">
  <title>Trainer App</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon-192.png">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main id="screen" class="screen" aria-live="polite"></main>

  <nav class="tabbar" role="tablist">
    <button class="tab" data-tab="today"  role="tab"><span class="tab-ic">☀️</span>Today</button>
    <button class="tab" data-tab="coach"  role="tab"><span class="tab-ic">🥊</span>Vic</button>
    <button class="tab" data-tab="train"  role="tab"><span class="tab-ic">🏋️</span>Train</button>
    <button class="tab" data-tab="fuel"   role="tab"><span class="tab-ic">🍲</span>Fuel</button>
    <button class="tab" data-tab="me"     role="tab"><span class="tab-ic">📈</span>Me</button>
  </nav>

  <div id="overlay-root"></div>

  <script type="module" src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol === 'https:') {
      navigator.serviceWorker.register('sw.js');
    }
  </script>
</body>
</html>
